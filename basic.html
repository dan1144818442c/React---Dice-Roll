<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      // קומפוננטה של תיבת הקלט


      function ChatInput({chatMessages , setChatMessages}) {
        const [inputText , setInputText] =  React.useState('');

        function save_input_text(event){
          setInputText( event.target.value)
        }

        function sendMessage(){
          setChatMessages([
          ...chatMessages , {
            message : inputText , 
            sender : "user" , 
            id : crypto.randomUUID()}
        ]
      ); 
      setInputText('');
        }

        return (
          <div>
            <input
             placeholder="Type message..."
             onChange = {save_input_text}
             value = {inputText}
              />
            <button
            onClick=  {sendMessage}
            >Send</button>
          </div>
        );
      }

      // קומפוננטה של הודעה בודדת
      function ChatMessage({ message, sender }) {
        return (
          <div style={{ margin: "8px 0" }}>
            <strong>{sender}:</strong> {message}
          </div>
        );
      }
      
      function ChatMessages({chatMessages}) {

        return (
            <>

                {chatMessages.map((msg) => {
                  return(
                    <ChatMessage
                        key={msg.id}
                        message={msg.message}
                        sender={msg.sender}
                    />
                );
        })}
            </>
        );

      }

      // קומפוננטת האפליקציה הראשית
      function App() {
        const [chatMessages , setChatMessages ] =  React.useState([
    
          
      { id: "id1", message: "hello chatbot", sender: "user" },
      { id: "id2", message: "hello, how can I help you?", sender: "robot" },
        ]);
      // const chatMessages = array[0]; 
      // const setChatMessages = array[1]; 
        return (
          <>
            <ChatInput
              chatMessages = {chatMessages}
              setChatMessages = {setChatMessages}
            />
            <ChatMessages
              chatMessages = {chatMessages}
             />
            
          </>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
